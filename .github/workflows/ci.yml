name: Linux CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libssl-dev pkg-config fonts-dejavu-core util-linux
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: bash -n scripts/install.sh scripts/install-linux.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: bun install --cwd runtime --frozen-lockfile --ignore-scripts
      - run: bun run --cwd runtime test
      - run: bun test --timeout 60000 extensions/omarchy-tools/tests/*.test.mjs
