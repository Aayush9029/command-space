name: Linux Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libssl-dev pkg-config fonts-dejavu-core rsync util-linux
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: bash scripts/package-linux.sh
      - run: bun scripts/verify-updater-isolated.ts dist/super-space-*-linux-${{ matrix.arch }}.tar.gz
      - run: bun install --cwd runtime --frozen-lockfile --ignore-scripts
      - run: bun run --cwd runtime typecheck
      - run: bun run --cwd runtime test
      - run: bun test --timeout 60000 extensions/omarchy-tools/tests/*.test.ts
      - run: bun test scripts/*.test.ts
      - run: python3 scripts/test-measure-performance.py
      - name: Check tag matches the executable
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: test "$(target/release/super-space --version)" = "Super Space ${RELEASE_TAG#v}"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish Linux packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "Super Space $RELEASE_TAG" --generate-notes
