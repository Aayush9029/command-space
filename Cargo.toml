[package]
name = "command-space"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A native Omarchy command launcher, derived from RustCast"
repository = "https://github.com/Aayush9029/command-space"
autobins = false

[[bin]]
name = "command-space"
path = "src/linux/main.rs"

[dependencies]
iced = { version = "0.14.0", default-features = false, features = ["tiny-skia", "wayland", "x11", "tokio", "image", "svg", "markdown", "advanced"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.149", features = ["preserve_order"] }
json5 = "0.4.1"
toml = "0.9.8"
tokio = { version = "1.48.0", features = ["full"] }
nucleo-matcher = "0.3.1"
evalexpr = "13.1.0"
emojis = "0.8.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
walkdir = "2.5.0"
url = "2.5.8"
sha2 = "0.11.0"
shell-words = "1.1.0"
ksni = { version = "0.3.6", features = ["blocking"] }
wl-clipboard-rs = "0.9.3"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "ico", "bmp"] }

resvg = { version = "0.45.1", default-features = false, features = ["text", "system-fonts"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
